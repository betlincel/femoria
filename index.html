<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#C2410C">
  <meta name="description" content="Femoria — evde üretim yapan kadınların el emeği ürünlerini mahallesindeki insanlarla buluşturan pazar yeri.">
  <title>Femoria</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="config-banner" class="config-banner" hidden>
    Supabase bağlantısı henüz ayarlanmadı. <code>js/config.js</code> dosyasına proje adresini ve anahtarını yazın.
  </div>

  <header class="topbar">
    <a href="#/" class="brand" aria-label="Femoria ana sayfa">
      <span class="brand-mark" aria-hidden="true">🌸</span>
      <span class="brand-name">Femoria</span>
    </a>
    <a href="#/profil" class="avatar-link" data-highlight="profil" aria-label="Profilim">
      <span id="topbar-avatar" class="avatar avatar-sm">👤</span>
    </a>
  </header>

  <main id="app" class="app" tabindex="-1" aria-live="polite"></main>

  <nav class="bottom-nav" aria-label="Ana menü">
    <a href="#/" data-route="vitrin" data-highlight="nav-vitrin">
      <span class="nav-icon" aria-hidden="true">🏠</span><span>Vitrin</span>
    </a>
    <a href="#/yakinimda" data-route="yakinimda" data-highlight="nav-yakinimda">
      <span class="nav-icon" aria-hidden="true">📍</span><span>Yakınımda</span>
    </a>
    <a href="#/sat" data-route="sat" data-highlight="nav-sat">
      <span class="nav-icon" aria-hidden="true">📸</span><span>Sat</span>
    </a>
    <a href="#/mesajlar" data-route="mesajlar" data-highlight="nav-mesajlar">
      <span class="nav-icon" aria-hidden="true">✉️<span id="unread-dot" class="dot" hidden></span></span><span>Mesajlar</span>
    </a>
  </nav>

  <button id="assistant-fab" class="assistant-fab" type="button" aria-label="Ayşe Abla'ya sor">
    <span class="fab-face" aria-hidden="true">🌸</span>
    <span class="fab-label">Ayşe Abla</span>
  </button>
  <section id="assistant-panel" class="assistant-panel" role="dialog" aria-label="Ayşe Abla" hidden></section>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
