# Supabase CLI yerel geliştirme ayarları (`supabase start`).
# Canlı projede aynı ayarlar Dashboard > Authentication bölümünden yapılır.

project_id = "femoria"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Üyelik ürün yüklemenin önüne konmaz; giriş sadece telefonla.
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Femoria giriş kodunuz: {{ .Code }}"
max_frequency = "60s"

# Yerelde SMS sağlayıcısı olmadan test: bu numaralara kod her zaman 123456'dır.
[auth.sms.test_otp]
905551112233 = "123456"
905554445566 = "123456"

# Canlıda bir SMS sağlayıcısı gerekir (Twilio, MessageBird, Vonage veya Textlocal).
# [auth.sms.twilio]
# enabled = true
# account_sid = "env(TWILIO_ACCOUNT_SID)"
# message_service_sid = "env(TWILIO_MESSAGE_SERVICE_SID)"
# auth_token = "env(TWILIO_AUTH_TOKEN)"

[edge_runtime]
enabled = true

[functions.ayse-abla]
verify_jwt = true
