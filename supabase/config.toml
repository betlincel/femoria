# Supabase CLI yerel geliştirme ayarları (`supabase start`).
# Canlı projede aynı ayarlar Dashboard > Authentication bölümünden yapılır.

project_id = "femoria"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Üyelik ürün yüklemenin önüne konmaz; giriş e-posta + şifre ile.
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
# Canlıda açık tutun (e-posta onayı "Doğrulanmış" sayılmanın şartı).
# Yerelde onay e-postaları Inbucket'a düşer: http://127.0.0.1:54324
enable_confirmations = true
double_confirm_changes = true
max_frequency = "60s"

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = true

[functions.ayse-abla]
verify_jwt = true

# Gece temizliği: pg_cron çağırır, x-cron-secret başlığıyla korunur (JWT yok)
[functions.purge-removed-photos]
verify_jwt = false
